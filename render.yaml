services:
  - type: web
    name: telegram-wallet-monitor
    env: docker

    healthCheckPath: /

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: wallet-postgres
          property: connectionString

      - key: SOURCE_CHANNEL
        sync: false

      - key: REPORT_CHANNEL
        sync: false

      - key: HOURLY_INTERVAL_MIN
        value: "60"

      - key: EXPORT_INTERVAL_MIN
        value: "120"

databases:
  - name: wallet-postgres
    databaseName: walletdb
    user: walletuser
    plan: free
